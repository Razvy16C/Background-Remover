<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14161c">
  <title>Background Remover</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Background Remover</h1>
    <p>Your image is processed on your own device and is not uploaded.</p>

    <label id="drop" for="file">
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp">
      Click to choose an image, or drag it here (PNG, JPG, WEBP)
    </label>

    <p id="status" role="status" aria-live="polite"></p>

    <div id="results" hidden>
      <figure>
        <img id="before" alt="Original image">
        <figcaption>Original</figcaption>
      </figure>
      <figure id="afterBox" hidden>
        <img id="after" alt="Image without background">
        <figcaption>Result</figcaption>
      </figure>
    </div>

    <a id="download" class="button" hidden>Download PNG</a>
  </main>

  <!-- Floating Dock -->
  <nav class="dock" aria-label="Quick navigation">
    <button class="dock-item is-active" type="button" aria-label="Home" aria-pressed="true" data-dock-item="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button class="dock-item" type="button" aria-label="Calendar" aria-pressed="false" data-dock-item="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
    </button>
    <button class="dock-item" type="button" aria-label="Mail" aria-pressed="false" data-dock-item="mail">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </button>
    <button class="dock-item" type="button" aria-label="Music" aria-pressed="false" data-dock-item="music">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>

    <span class="dock-separator" aria-hidden="true"></span>

    <button class="dock-item" type="button" aria-label="GitHub" aria-pressed="false" data-dock-item="github">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.1-1.5 6.1-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6S17.5 1.2 14 3.5a13.3 13.3 0 0 0-7 0C3.5 1.2 2.3 1.5 2.3 1.5a4.8 4.8 0 0 0-.1 3.6A5.2 5.2 0 0 0 .8 8.7c0 5.2 3.1 6.4 6.1 6.7A3.4 3.4 0 0 0 6 18.1V22"/></svg>
    </button>
    <button class="dock-item" type="button" aria-label="Sparkles" aria-pressed="false" data-dock-item="sparkles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2zM19 14l1.1 2.9L23 18l-2.9 1.1L19 22l-1.1-2.9L15 18l2.9-1.1zM5 2l.8 2.2L8 5l-2.2.8L5 8l-.8-2.2L2 5l2.2-.8z"/></svg>
    </button>
    <button class="dock-item" type="button" aria-label="Settings" aria-pressed="false" data-dock-item="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9z"/></svg>
    </button>
  </nav>

  <script>
    // Dock active state. Replace this handler with real navigation when pages exist.
    document.querySelectorAll("[data-dock-item]").forEach((item) => {
      item.addEventListener("click", () => {
        document.querySelectorAll("[data-dock-item]").forEach((button) => {
          button.classList.remove("is-active");
          button.setAttribute("aria-pressed", "false");
        });
        item.classList.add("is-active");
        item.setAttribute("aria-pressed", "true");
      });
    });
  </script>

  <script type="module">
    const LIB = "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";
    const $ = id => document.getElementById(id);
    let busy = false;

    // Run the AI on one thread for better compatibility with static hosting.
    try {
      Object.defineProperty(navigator, "hardwareConcurrency", {
        configurable: true,
        get: () => 1
      });
    } catch (error) {
      console.warn("Could not override hardwareConcurrency:", error);
    }

    async function handle(file) {
      if (!file || busy) return;

      if (!/^image\\/(png|jpeg|webp)$/.test(file.type)) {
        $("status").textContent = "Please choose a PNG, JPG or WEBP image.";
        return;
      }

      busy = true;
      if ($("before").src) URL.revokeObjectURL($("before").src);
      if ($("after").src) URL.revokeObjectURL($("after").src);

      $("before").src = URL.createObjectURL(file);
      $("results").hidden = false;
      $("afterBox").hidden = true;
      $("download").hidden = true;
      $("status").textContent = "Loading the AI model (the first time takes a while)...";

      try {
        const { removeBackground } = await import(LIB);
        const blob = await removeBackground(file, {
          progress: (key, current, total) => {
            $("status").textContent = key.startsWith("fetch") && total
              ? `Downloading model files: ${Math.round(current / total * 100)}%`
              : "Removing background...";
          }
        });

        const url = URL.createObjectURL(blob);
        $("after").src = url;
        $("afterBox").hidden = false;
        $("download").href = url;
        $("download").download = file.name.replace(/\\.[^.]+$/, "") + "-no-bg.png";
        $("download").hidden = false;
        $("status").textContent = "Done!";
      } catch (err) {
        console.error(err);
        $("status").textContent = `Something went wrong: ${err.name}: ${err.message}`;
      } finally {
        busy = false;
      }
    }

    $("file").addEventListener("change", e => {
      handle(e.target.files[0]);
      e.target.value = "";
    });

    const drop = $("drop");
    for (const type of ["dragenter", "dragover", "dragleave", "drop"]) {
      window.addEventListener(type, e => {
        e.preventDefault();
        drop.classList.toggle("over", type === "dragenter" || type === "dragover");
        if (type === "drop") handle(e.dataTransfer.files[0]);
      });
    }
  </script>
</body>
</html>
